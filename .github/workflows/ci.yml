name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Access promptli-comms (private until launch)
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROMPTLI_COMMS_DEPLOY_KEY }}
      - run: git config --global url."ssh://git@github.com/promptli-dev/promptli-comms".insteadOf "https://github.com/promptli-dev/promptli-comms"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .
      - name: Lint install.sh
        run: shellcheck install.sh && sh -n install.sh
