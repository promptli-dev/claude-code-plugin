[project]
name = "promptli-claude"
version = "0.1.0"
description = "Give Claude Code its own email address and phone number with Promptli Comms"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "promptli[cli]",
    "promptli-gateway",
    "claude-agent-sdk>=0.2.173",
    "typer>=0.15",
]

[project.scripts]
promptli-claude = "promptli_claude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptli_claude"]

# Until promptli / promptli-gateway are on PyPI, both come from the promptli-comms repo at a pinned commit.
[tool.uv.sources]
promptli = { git = "https://github.com/promptli-dev/promptli-comms", subdirectory = "sdk/python", rev = "c8cbdf5002aee605696ef8ac7908e1939e3114f2" }
promptli-gateway = { git = "https://github.com/promptli-dev/promptli-comms", subdirectory = "gateway", rev = "c8cbdf5002aee605696ef8ac7908e1939e3114f2" }

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["promptli_claude"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["promptli_claude"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: needs the real `claude` CLI and a Promptli test key"]
